name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.preset }})
    runs-on: windows-2022

    strategy:
      fail-fast: false
      matrix:
        preset: [ windows-msvc-debug, windows-msvc-release ]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup vcpkg Environment
        shell: pwsh
        run: |
          $vcpkgDir = if ($env:VCPKG_INSTALLATION_ROOT -and (Test-Path $env:VCPKG_INSTALLATION_ROOT)) {
              $env:VCPKG_INSTALLATION_ROOT
          } elseif (Test-Path "C:\vcpkg") {
              "C:\vcpkg"
          } else {
              git clone https://github.com/microsoft/vcpkg.git "$HOME/vcpkg"
              & "$HOME/vcpkg/bootstrap-vcpkg.bat"
              "$HOME/vcpkg"
          }
          Write-Host "Configuring VCPKG_ROOT=$vcpkgDir"
          "VCPKG_ROOT=$vcpkgDir" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Configure CMake
        run: cmake --preset ${{ matrix.preset }}

      - name: Build All Targets
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Run Test Suite (CTest)
        run: ctest --preset ${{ matrix.preset }} --output-on-failure

